  function icon(name, size=18) { return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||ICON_PATHS.book}</svg>`; }
  function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function getText(obj,k,fallback='') { return typeof obj?.[k] === 'string' ? obj[k].slice(0,12000) : fallback; }
  function randomId() { return 'topic-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
  function normalizeTopic(raw, existing=[]) {
    if(!raw || typeof raw!=='object' || !SUBJECTS.includes(raw.subject)) throw Error('subjectはFAR・REG・AUD・TCPのいずれかにしてください。');
    if(!getText(raw,'title').trim()) throw Error('論点タイトルが空です。');
    const matched = existing.find(t => t.subject===raw.subject && t.title===raw.title);
    const listOf = (arr,max=40) => Array.isArray(arr) ? arr.slice(0,max).filter(x=>typeof x==='string').map(x=>x.slice(0,3000)) : [];
    const comparisons = (Array.isArray(raw.comparisons) ? raw.comparisons : []).slice(0,30).map(c=>({label:getText(c,'label').slice(0,200),detail:getText(c,'detail').slice(0,3000)})).filter(c=>c.label||c.detail);
    const questions = (Array.isArray(raw.questions) ? raw.questions : []).slice(0,60).map(q=>{
      if(!q || typeof q.prompt!=='string' || !Array.isArray(q.options)) return null;
      const options = q.options.slice(0,6).filter(x=>typeof x==='string').map(x=>x.slice(0,800));
      if(options.length<2 || !Number.isInteger(q.correctIndex) || q.correctIndex<0 || q.correctIndex>=options.length || !q.prompt.trim()) return null;
      return {prompt:q.prompt.slice(0,1200),options,correctIndex:q.correctIndex,explanation:getText(q,'explanation').slice(0,2000)};
    }).filter(Boolean);
    return {
      id:getText(raw,'id').trim().slice(0,180) || matched?.id || randomId(), subject:raw.subject,
      area:getText(raw,'area','未分類').trim()||'未分類',title:raw.title.trim().slice(0,200),english:getText(raw,'english'),
      tags:listOf(raw.tags,20),summary:getText(raw,'summary'),why:getText(raw,'why'),steps:listOf(raw.steps),formula:getText(raw,'formula'),
      comparisons,pitfalls:listOf(raw.pitfalls),example:getText(raw,'example'),questions,
      source:getText(raw,'source','ユーザー追加') || 'ユーザー追加'
    };
  }
  function initialDb() { return {version:1,topics:window.USCPA_SEED.map(t=>normalizeTopic(t)),progress:{},settings:{createdAt:new Date().toISOString()}}; }
  let storeFailure = false;
  function loadDb() {
    try {
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return initialDb();
      const saved=JSON.parse(raw);
      if(!saved || !Array.isArray(saved.topics)) throw Error('保存形式が不正');
      const topics=saved.topics.map(x=>{try{return normalizeTopic(x)}catch{return null}}).filter(Boolean);
      return {version:1, topics, progress:typeof saved.progress==='object'&&saved.progress? saved.progress:{},settings:typeof saved.settings==='object'&&saved.settings?saved.settings:{}};
    } catch(e) { storeFailure=true; return initialDb(); }
  }
  let db=loadDb();
  const state={view:'home',subject:'ALL',status:'ALL',search:'',detailId:null,detailTab:'explain',detailQuizIndex:0,detailQuizAnswer:null, quiz:null,quizSubject:'ALL',quizMode:'due',modal:null};

  function prog(id) {return db.progress[id]||{};}
  function studyStatus(id) {return prog(id).mastery||'new';}
  function statusLabel(code){return {new:'未学習',learning:'学習中',review:'要復習',mastered:'定着済み'}[code]||'未学習';}
  function statusTag(code) {const c={new:'tag-muted',learning:'tag-amber',review:'tag-red',mastered:'tag-green'}[code]||'tag-muted';return `<span class="tag ${c}">${statusLabel(code)}</span>`;}
  function isDue(id){const p=prog(id);return Boolean(p.nextReview&&Number(p.nextReview)<=Date.now()) || (p.mastery==='review'&&!p.nextReview);}
  const dueTopics=()=>db.topics.filter(t=>isDue(t.id));
  const qsCount=()=>db.topics.reduce((n,t)=>n+t.questions.length,0);
  function topicsStudied(){return db.topics.filter(t=>studyStatus(t.id)!=='new').length;}
  function topicsMastered(){return db.topics.filter(t=>studyStatus(t.id)==='mastered').length;}

  function sidebar(){const entries=[['home','ホーム','home'],['library','論点一覧','book'],['review','確認・復習','repeat'],['data','データ管理','layers']];return `<aside class="sidebar"><div class="brand"><div class="brand-mark">U.</div><div class="brand-copy"><strong>USCPA Lab</strong><small>KNOWLEDGE STUDIO</small></div></div><div class="nav-group-title">STUDY SPACE</div><nav aria-label="メインメニュー">${entries.map(([v,n,i])=>`<button class="nav-btn ${state.view===v||(state.view==='detail'&&v==='library')?'active':''}" data-action="nav" data-view="${v}">${icon(i)}<span>${n}</span></button>`).join('')}</nav><div class="side-spacer"></div><div class="sidebar-bottom">FAR · REG · AUD · TCP<br>自分だけの論点データベース<br><span style="color:#72dfc7">●</span> データはこの端末に保存</div></aside>`;}
  function mobileTop(){return `<header class="mobile-top"><div class="logo"><div class="brand-mark">U.</div><span>USCPA Lab <small>／ Knowledge Studio</small></span></div><span class="pill">無料・オフライン対応</span></header>`;}
  function bottomNav(){return `<nav class="bottom-nav" aria-label="モバイルメニュー">${[['home','ホーム','home'],['library','論点','book'],['review','復習','repeat'],['data','データ','layers']].map(([v,n,i])=>`<button class="${state.view===v||(state.view==='detail'&&v==='library')?'active':''}" data-action="nav" data-view="${v}" aria-label="${n}">${icon(i,21)}<span>${n}</span></button>`).join('')}</nav>`;}
  function topbar(){const cfg={home:['DASHBOARD','学習ダッシュボード'],library:['TOPIC LIBRARY','論点一覧'],detail:['TOPIC NOTES','論点ノート'],review:['PRACTICE & REVIEW','確認・復習'],data:['DATA MANAGEMENT','データ管理'],editor:['EDIT TOPIC','論点の追加']};const [eyebrow,title]=cfg[state.view]||cfg.home;return `<header class="topbar"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="top-actions">${state.view==='library'||state.view==='home'?`<button class="btn btn-primary btn-sm" data-action="add">${icon('plus')} 追加</button>`:''}${state.view==='detail'?`<button class="btn btn-sm" data-action="edit" data-id="${esc(state.detailId)}">${icon('edit')} 編集</button>`:''}</div></header>`;}
  function subjectCard(subj){const topics=db.topics.filter(t=>t.subject===subj);const done=topics.filter(t=>studyStatus(t.id)==='mastered').length;const pct=topics.length?Math.round(done/topics.length*100):0;const palette={FAR:['#e5edff','#3569d4'],REG:['#e7f8ec','#2a9d63'],AUD:['#f0eafa','#8054bb'],TCP:['#fff0df','#d58930']}[subj];return `<button class="subject-card" data-action="subject" data-subject="${subj}"><div class="subject-head"><span class="subject-icon" style="background:${palette[0]};color:${palette[1]}">${subj.slice(0,1)}</span><span class="arrow">↗</span></div><h3>${subj}</h3><p>${SUBJECT_NAMES[subj]}</p><div class="progress-track"><div class="progress-bar" style="width:${pct}%;background:${palette[1]}"></div></div><div class="subject-foot">${topics.length} 論点 · 定着 ${done} · ${pct}%</div></button>`;}
  function home(){const due=dueTopics();const recent=db.topics.filter(t=>prog(t.id).lastStudied).sort((a,b)=>prog(b.id).lastStudied-prog(a.id).lastStudied).slice(0,4);return `
    <section class="hero"><div><div class="eyebrow" style="color:#78e7d0">YOUR LEARNING, ORGANIZED</div><h2>理解して、解けるまで。<br>論点を自分の武器に。</h2><p>論点整理・比較・4択演習・復習を、ひとつの場所で。</p><button class="btn btn-mint" data-action="nav" data-view="review">${icon('arrow')} 今日の復習をはじめる</button></div><div class="hero-stamp">${due.length}<small>復習待ち論点</small></div></section>
    <div class="stats-grid"><div class="card stat"><small>登録論点</small><strong>${db.topics.length}<span>件</span></strong><div class="stat-foot">4科目対応</div></div><div class="card stat"><small>学習済み</small><strong>${topicsStudied()}<span>件</span></strong><div class="stat-foot">初回学習を含む</div></div><div class="card stat"><small>今日の復習</small><strong>${due.length}<span>件</span></strong><div class="stat-foot">期限到来分</div></div></div>

    <div class="split"><section><div class="section-title"><h2>復習が必要な論点</h2><button class="text-link" data-action="nav" data-view="review">復習する →</button></div><div class="card pad-card">${due.length?`<div class="due-list">${due.slice(0,5).map(t=>`<div class="due-row"><div style="min-width:0"><button data-action="detail" data-id="${esc(t.id)}">${esc(t.title)}</button><small>${esc(t.area)}</small></div><span class="tag tag-${t.subject}">${t.subject}</span></div>`).join('')}</div>`:`<div class="empty">${icon('check',32)}<h3>復習待ちはありません</h3><p class="small">論点カードや問題演習から学習を始めましょう。</p></div>`}</div></section>
    <section><div class="section-title"><h2>最近学習した論点</h2></div><div class="card pad-card">${recent.length?recent.map(t=>`<div class="recent-row"><div style="min-width:0"><button data-action="detail" data-id="${esc(t.id)}">${esc(t.title)}</button><small>${esc(t.area)}</small></div>${statusTag(studyStatus(t.id))}</div>`).join(''):`<div class="empty">${icon('book',32)}<h3>これから学習開始！</h3><p class="small">最初の論点を開いてみてください。</p></div>`}</div></section></div>
    <div class="notice mt-5">初期収録の${window.USCPA_SEED.length}件は操作確認用の学習サンプルです。実際の試験対策では教材と受験年度のAICPA Blueprintを確認してください。</div>`;}
  function filterTopics(){let items=db.topics.filter(t=>state.subject==='ALL'||t.subject===state.subject);if(state.status==='favorite')items=items.filter(t=>prog(t.id).favorite);else if(state.status==='due')items=items.filter(t=>isDue(t.id));else if(state.status!=='ALL')items=items.filter(t=>studyStatus(t.id)===state.status);const q=state.search.trim().toLocaleLowerCase();if(q)items=items.filter(t=>[t.title,t.english,t.area,t.summary,t.tags.join(' '),t.subject].join(' ').toLocaleLowerCase().includes(q));return items.sort((a,b)=>SUBJECTS.indexOf(a.subject)-SUBJECTS.indexOf(b.subject)||a.area.localeCompare(b.area,'ja')||a.title.localeCompare(b.title,'ja'));}
  function topicCard(t){const p=prog(t.id);return `<article class="topic-card"><button class="topic-open" data-action="detail" data-id="${esc(t.id)}"><div class="meta-pills"><span class="tag tag-${t.subject}">${t.subject}</span><span class="tag tag-muted">${esc(t.area)}</span>${isDue(t.id)?'<span class="tag tag-red">期限到来</span>':''}</div><h3>${esc(t.title)}</h3><div class="en">${esc(t.english||'')}</div><p>${esc(t.summary||'要点を追加してカスタマイズしましょう。')}</p></button><div class="foot">${statusTag(studyStatus(t.id))}<div class="toolbar"><span class="tiny muted">${t.questions.length} 問</span><button class="icon-btn ${p.favorite?'on':''}" data-action="favorite" data-id="${esc(t.id)}" title="お気に入り" aria-label="お気に入りを切り替え">${icon('star')}</button></div></div></article>`;}
  function library(){return `<div class="filters" role="group" aria-label="科目">${['ALL',...SUBJECTS].map(s=>`<button class="chip ${state.subject===s?'active':''}" data-action="filter-subject" data-subject="${s}">${s==='ALL'?'すべて':s}</button>`).join('')}</div><div class="searchline"><div class="searchbox">${icon('search')}<input id="topic-search" class="field" type="search" placeholder="論点・英語・キーワードで検索" value="${esc(state.search)}" autocomplete="off" aria-label="論点検索"></div><button class="btn btn-primary" data-action="add">${icon('plus')}<span>追加</span></button></div><div class="filters" role="group" aria-label="学習ステータス">${[['ALL','全件'],['new','未学習'],['learning','学習中'],['review','要復習'],['mastered','定着済み'],['due','復習期限'],['favorite','★ お気に入り']].map(([k,v])=>`<button class="chip ${state.status===k?'active':''}" data-action="filter-status" data-status="${k}">${v}</button>`).join('')}</div><div id="library-results">${libraryResults()}</div>`;}
  function libraryResults(){const items=filterTopics();return `<div class="list-meta"><span>${items.length} 件の論点</span><span>タップで解説・比較・演習</span></div>${items.length?`<div class="topic-list">${items.map(topicCard).join('')}</div>`:`<div class="card empty">${icon('search',32)}<h3>該当する論点がありません</h3><p class="small">検索条件を変えるか、新しい論点を登録してください。</p><button class="btn btn-primary mt-3" data-action="add">${icon('plus')} 論点を追加</button></div>`}`;}

  function detailQuiz(t){if(!t.questions.length)return `<div class="card empty"><h3>まだ確認問題がありません</h3><p class="small">論点を編集するか、JSONからまとめて追加できます。</p><button class="btn btn-primary" data-action="edit" data-id="${esc(t.id)}">問題を追加</button></div>`;const qindex=Math.min(state.detailQuizIndex,t.questions.length-1);const q=t.questions[qindex];return `<section class="quiz-shell"><div class="quiz-meta"><span>${t.subject} · ${esc(t.area)}</span><span>問題 ${qindex+1} / ${t.questions.length}</span></div><div class="card quiz-card"><span class="tag tag-${t.subject}">理解度チェック</span><h2>${esc(q.prompt)}</h2>${quizOptions(q,state.detailQuizAnswer,'detail-answer')}${state.detailQuizAnswer!==null?`<div class="toolbar mt-5"><button class="btn btn-primary" data-action="detail-next">${qindex+1<t.questions.length?'次の問題へ':'最初の問題へ'} ${icon('arrow')}</button><button class="btn" data-action="nav" data-view="review">復習画面へ</button></div>`:''}</div></section>`;}
  function review(){if(state.quiz)return runningQuiz();const due=dueTopics(),dueQs=due.reduce((n,t)=>n+t.questions.length,0);return `<section class="review-setup"><div class="card review-hero mb-3"><div class="number">${due.length}<span> 論点</span></div><div><h2 style="margin:0;font-size:17px">今日の復習待ち</h2><p>${dueQs} 問が対象です。間違えた問題は翌日復習、正答が続くと間隔が延びます。</p></div></div><div class="card form-panel"><h2>演習を始める</h2><div class="form-group"><label class="label" for="quiz-subject">科目</label><select class="field" id="quiz-subject">${[['ALL','全科目'],...SUBJECTS.map(s=>[s,s])].map(([v,n])=>`<option value="${v}" ${state.quizSubject===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="form-group"><label class="label" for="quiz-mode">演習モード</label><select class="field" id="quiz-mode"><option value="due" ${state.quizMode==='due'?'selected':''}>期限が来た論点を復習</option><option value="all" ${state.quizMode==='all'?'selected':''}>全論点から自由演習</option><option value="weak" ${state.quizMode==='weak'?'selected':''}>苦手論点を優先</option></select></div><div class="notice mb-3">1回最大10問。解答すると正誤と解説を表示し、理解度と次回復習日を自動更新します。</div><button class="btn btn-primary btn-block" data-action="start-quiz">${icon('arrow')} 演習スタート</button></div><div class="mt-5"><div class="section-title"><h2>復習ルール</h2></div><div class="card pad-card"><p class="small"><strong>正解</strong>：連続正解に応じて1 → 3 → 7 → 14 → 30日の間隔で復習。</p><p class="small"><strong>不正解</strong>：連続正解をリセットし、翌日から復習対象に。</p><p class="small muted" style="margin:0">ブラウザのデータを消すと記録も消えるため、定期的なバックアップを推奨します。</p></div></div></section>`;}
  function buildQuiz(){const subject=document.getElementById('quiz-subject')?.value||'ALL',mode=document.getElementById('quiz-mode')?.value||'due';state.quizSubject=subject;state.quizMode=mode;let topics=db.topics.filter(t=>(subject==='ALL'||t.subject===subject)&&t.questions.length);if(mode==='due')topics=topics.filter(t=>isDue(t.id));if(mode==='weak')topics=topics.filter(t=>['review','learning'].includes(studyStatus(t.id)));let pool=topics.flatMap(t=>t.questions.map((q,idx)=>({id:t.id,idx})));if(!pool.length){toast('対象の問題がありません。「全論点から自由演習」をお試しください。',true);return;}for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}state.quiz={queue:pool.slice(0,10),cursor:0,answer:null,correct:0,wrong:0};render();}
  function runningQuiz(){const quiz=state.quiz;if(quiz.cursor>=quiz.queue.length)return quizFinished();const current=quiz.queue[quiz.cursor],t=db.topics.find(x=>x.id===current.id);if(!t||!t.questions[current.idx]){quiz.cursor++;return runningQuiz();}const q=t.questions[current.idx];const n=quiz.queue.length;return `<div class="quiz-shell"><button class="detail-back" data-action="quit-quiz">${icon('back')} 演習を終了</button><div class="quiz-meta"><span>${esc(t.title)} ${statusTag(studyStatus(t.id))}</span><span>${quiz.cursor+1} / ${n} 問</span></div><div class="progress-track" style="height:6px;margin-bottom:15px"><div class="progress-bar" style="background:#54bca9;width:${Math.round(quiz.cursor/n*100)}%"></div></div><div class="card quiz-card"><span class="tag tag-${t.subject}">${t.subject}</span> <span class="tag tag-muted">${esc(t.area)}</span><h2>${esc(q.prompt)}</h2>${quizOptions(q,quiz.answer,'quiz-answer')}${quiz.answer!==null?`<div class="toolbar mt-5"><button class="btn btn-primary btn-block" data-action="quiz-next">${quiz.cursor+1<n?'次の問題へ':'結果を見る'} ${icon('arrow')}</button><button class="text-link" data-action="detail" data-id="${esc(t.id)}">論点を詳しく見る</button></div>`:''}</div></div>`;}

  function recordAnswer(id,correct){const p=prog(id);p.attempts=(Number(p.attempts)||0)+1;p.correct=(Number(p.correct)||0)+(correct?1:0);p.lastStudied=Date.now();if(correct){p.streak=(Number(p.streak)||0)+1;p.mastery=p.streak>=3?'mastered':'learning';const gaps=[1,3,7,14,30];const days=gaps[Math.min(p.streak-1,gaps.length-1)];p.nextReview=Date.now()+days*86400000;}else{p.streak=0;p.mastery='review';p.nextReview=Date.now()+86400000;}db.progress[id]=p;saveDb();}
  function dataPage(){return `<div class="data-grid"><section class="card data-card"><div class="eyebrow">BACKUP & RESTORE</div><h2>① バックアップ</h2><p>すべての論点・学習状況・お気に入りを1つのJSONファイルに保存。機種変更時にも復元できます。</p><button class="btn btn-primary" data-action="export-backup">${icon('download')} 全データを書き出す</button><button class="btn" data-action="export-topics">${icon('download')} 論点だけ出力</button><p class="form-help">最後に書き出したファイルは「ファイル」アプリ等へ保存してください。自動でクラウド共有はされません。</p></section><section class="card data-card"><div class="eyebrow">IMPORT TOPICS</div><h2>② 論点を追加・復元</h2><p>ChatGPT作成の論点JSONや、アプリから書き出したバックアップを取り込めます。</p><div class="form-group"><label for="import-mode" class="label">読み込み方法</label><select id="import-mode" class="field"><option value="merge">追加・更新（今のデータを残す）</option><option value="replace">全置換（現在のデータを入れ替え）</option></select></div><input id="import-file" type="file" accept=".json,application/json" hidden><button class="btn btn-primary" data-action="choose-file">${icon('upload')} JSONファイルを選ぶ</button></section><section class="card data-card"><div class="eyebrow">PASTE JSON</div><h2>③ JSONを貼り付け</h2><p>ChatGPTが生成したJSONを貼り付けるだけで、複数の論点を一度に登録できます。</p><label class="label" for="json-paste">JSON本文</label><textarea id="json-paste" class="field" rows="6" placeholder='{"topics": [{"subject":"FAR", "title":"...", "summary":"..."}]}'></textarea><button class="btn btn-primary mt-3" data-action="import-paste">${icon('plus')} 貼り付け内容を取り込む</button></section><section class="card data-card"><div class="eyebrow">ADD WITH CHATGPT</div><h2>④ 論点作成プロンプト</h2><p>教材写真を送る際に使える、アプリと互換性のあるJSON作成指示をコピーします。</p><button class="btn btn-primary" data-action="copy-prompt">${icon('copy')} 追加用プロンプトをコピー</button><div class="divider"></div><h2>サンプル論点</h2><p>最初の操作確認用サンプルが消えてしまった場合に再追加できます。</p><button class="btn" data-action="restore-samples">サンプルを不足分だけ追加</button></section></div><section class="card data-card mt-5"><h2>保存について大切なこと</h2><p>このアプリは無料・ログイン不要です。データは各ブラウザ・各端末の保存領域（localStorage）に置かれ、GitHubやChatGPTへ自動送信されません。Safari・ホーム画面版・別のiPhone間でデータが共有される保証はありません。</p><div class="notice">週に1回、または論点を大量追加した直後に「全データを書き出す」をおすすめします。ブラウザの履歴・サイトデータ削除で学習記録が消える場合があります。</div><div class="divider"></div><button class="btn btn-danger" data-action="reset-all">${icon('trash')} 全データを初期化</button></section>`;}
  function input(name,label,value='',placeholder='',type='text',help=''){return `<div class="form-group"><label class="label" for="f-${name}">${label}</label>${type==='textarea'?`<textarea class="field" id="f-${name}" name="${name}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input class="field" id="f-${name}" name="${name}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}">`}${help?`<div class="form-help">${help}</div>`:''}</div>`;}
  function modalForm(){if(!state.modal)return '';const edit=state.modal.kind==='edit';const t=edit?db.topics.find(x=>x.id===state.modal.id):null;const x=t||{subject:state.subject==='ALL'?'FAR':state.subject,area:'',title:'',english:'',summary:'',why:'',steps:[],formula:'',comparisons:[],pitfalls:[],example:'',tags:[],source:'',questions:[]};const q=x.questions?.[0];return `<div class="modal-layer" id="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><h2 id="dialog-title">${edit?'論点を編集':'新しい論点を追加'}</h2><button class="icon-btn" data-action="close-modal" aria-label="閉じる">${icon('close')}</button></div><div class="modal-body"><form id="topic-form"><div class="form-grid"><div class="form-group"><label class="label" for="f-subject">科目 *</label><select class="field" id="f-subject" name="subject">${SUBJECTS.map(s=>`<option value="${s}" ${x.subject===s?'selected':''}>${s}</option>`).join('')}</select></div>${input('area','分類・チャプター',x.area,'例：Liabilities')}${input('title','論点タイトル *',x.title,'例：社債の実効利息法')}${input('english','英語名',x.english,'例：Effective Interest Method')}</div>${input('summary','結論・要点',x.summary,'最も重要な結論を記載','textarea')}${input('why','なぜそうなる？',x.why,'理解のための理由を記載','textarea')}${input('formula','公式・仕訳・ルール',x.formula,'計算式や仕訳を記載','textarea')}${input('steps','理解の順序・手順（1行1項目）',x.steps.join('\n'),'手順を1行ずつ入力','textarea')}${input('comparisons','比較（1行につき「項目｜説明」）',x.comparisons.map(c=>c.label+'｜'+c.detail).join('\n'),'割引発行｜帳簿価額が増加','textarea')}${input('pitfalls','ひっかけ・注意点（1行1項目）',x.pitfalls.join('\n'),'注意点を1行ずつ入力','textarea')}${input('example','具体例',x.example,'簡単な具体例や数値例','textarea')}<div class="form-grid">${input('tags','検索タグ（カンマ区切り）',x.tags.join(', '),'社債, interest, FAR')}${input('source','教材・出典メモ',x.source,'TAC講義 第○章')}</div><div class="divider"></div><h3>4択の確認問題 <span class="small muted">（任意）</span></h3><div class="notice mb-3">ここでは最初の1問を編集します。複数問の登録・編集はJSON取り込みで対応します。${edit&&x.questions.length>1   function formLines(v){return v.split('\n').map(s=>s.trim()).filter(Boolean);}
  function saveForm(form){const fd=new FormData(form);const v=k=>String(fd.get(k)||'').trim();if(!v('title')){toast('論点タイトルを入力してください。',true);form.querySelector('#f-title').focus();return;}const editing=state.modal?.kind==='edit';const old=editing?db.topics.find(x=>x.id===state.modal.id):null;let questions=old?[...old.questions]:[];if(v('prompt')){const options=['a','b','c','d'].map(k=>v('option-'+k));if(options.filter(Boolean).length!==4){toast('確認問題を設定する場合、選択肢A〜Dをすべて入力してください。',true);return;}const q={prompt:v('prompt'),options,correctIndex:Number(v('correct')),explanation:v('explanation')};if(questions.length)questions[0]=q;else questions=[q];}else if(old&&old.questions.length){questions=old.questions;}const raw={id:old?.id||randomId(),subject:v('subject'),area:v('area')||'未分類',title:v('title'),english:v('english'),summary:v('summary'),why:v('why'),steps:formLines(v('steps')),formula:v('formula'),comparisons:formLines(v('comparisons')).map(line=>{const [label,...rest]=line.split(/[｜|]/);return {label:label.trim(),detail:rest.join('｜').trim()};}),pitfalls:formLines(v('pitfalls')),example:v('example'),tags:v('tags').split(/[,，]/).map(s=>s.trim()).filter(Boolean),source:v('source')||'ユーザー追加',questions};let topic;try{topic=normalizeTopic(raw,db.topics);}catch(e){toast(e.message,true);return;}if(old){db.topics=db.topics.map(t=>t.id===old.id?topic:t);}else db.topics.push(topic);saveDb();state.modal=null;showDetail(topic.id);toast(old?'論点を更新しました':'論点を追加しました');}

  const PROMPT = `あなたはUSCPA（FAR・REG・AUD・TCP）専門講師です。添付した教材・写真に実際に書かれた論点を、USCPA Knowledge Labに取り込めるJSONとして整理してください。\n【厳守】教材内容と推測・補足を混同しない。判読不能な部分は推測しない。試験法令・税額など年度依存の数値は、確認できない場合は断定しない。教科書の長文をそのまま転載せず、独自の短い要約を作る。\n出力はJSONのみ。次の形式で複数論点をtopics配列に入れてください。\n{\n  "topics": [\n    {\n      "subject": "FAR",\n      "area": "例：負債",\n      "title": "論点の日本語名",\n      "english": "English Term",\n      "tags": ["検索キーワード"],\n      "summary": "結論を1〜3文で",\n      "why": "なぜそうなるのか",\n      "steps": ["手順1", "手順2"],\n      "formula": "公式・仕訳・判断基準",\n      "comparisons": [{"label":"比較対象A","detail":"違いの説明"}],\n      "pitfalls": ["間違えやすい点"],\n      "example": "簡潔な例題・数値例",\n      "questions": [\n        {"prompt":"4択問題","options":["Aの本文","Bの本文","Cの本文","Dの本文"],"correctIndex":0,"explanation":"正解の根拠"}\n      ],\n      "source": "教材名・章・写真のページ（分かる範囲）"\n    }\n  ]\n}\ncorrectIndexは0=A、1=B、2=C、3=D。問題は各論点1〜3問。読めない・根拠がないことは追加しない。`; 
  async function copyText(text){try{await navigator.clipboard.writeText(text);toast('プロンプトをコピーしました');}catch(e){const node=document.createElement('textarea');node.value=text;document.body.appendChild(node);node.select();try{document.execCommand('copy');toast('プロンプトをコピーしました');}catch{toast('コピーできませんでした。HTTPSで開くか手動コピーしてください。',true);}node.remove();}}
  function parseImportText(raw){const stripped=raw.trim().replace(/^\uFEFF/,'').replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let data;try{data=JSON.parse(stripped);}catch(e){throw Error('JSONとして読み込めません。JSONのみを貼り付けてください。');}const arr=Array.isArray(data)?data:Array.isArray(data?.topics)?data.topics:null;if(!arr)throw Error('JSONにtopics配列がありません。');if(!arr.length)throw Error('論点が0件です。');if(arr.length>10000)throw Error('一度に取り込める論点は最大10,000件です。');return {arr,progress:data?.progress,settings:data?.settings};}
  function doImport(text){let parsed;try{parsed=parseImportText(text);}catch(e){toast(e.message,true);return;}const mode=document.getElementById('import-mode')?.value||'merge';if(mode==='replace'&&!window.confirm(`全置換します。現在の${db.topics.length}件と学習記録は上書きされます。バックアップを保存しましたか？`))return;
    const incoming=[];const errors=[];for(let i=0;i<parsed.arr.length;i++){try{incoming.push(normalizeTopic(parsed.arr[i], [...db.topics,...incoming]));}catch(e){errors.push(`${i+1}件目: ${e.message}`);}}

    for(const t of incoming){const sameByTitle=db.topics.find(x=>x.subject===t.subject&&x.title===t.title);const idx=index.has(t.id)?index.get(t.id):sameByTitle?db.topics.indexOf(sameByTitle):-1;
      if(idx>=0){const original=db.topics[idx];db.topics[idx]={...t,id:original.id};sourceToTargetId.set(t.id,original.id);updated++;}else{index.set(t.id,db.topics.length);db.topics.push(t);sourceToTargetId.set(t.id,t.id);added++;}}
    if(parsed.progress && typeof parsed.progress==='object' && !Array.isArray(parsed.progress)){
      for(const t of incoming){const p=parsed.progress[t.id];if(p&&typeof p==='object'&&!Array.isArray(p))db.progress[sourceToTargetId.get(t.id)||t.id]={...db.progress[sourceToTargetId.get(t.id)||t.id],...p};}
    }
    saveDb();state.search='';state.status='ALL';state.subject='ALL';navigate('library');toast(`取り込み完了：新規${added}件、更新${updated}件${errors.length?'（不正'+errors.length+'件を除外）':''}`);
  }
  function deleteTopic(id){const t=db.topics.find(x=>x.id===id);if(!t)return;if(!window.confirm(`「${t.title}」を削除しますか？ 学習記録も削除されます。`))return;db.topics=db.topics.filter(x=>x.id!==id);delete db.progress[id];saveDb();state.modal=null;navigate('library');toast('論点を削除しました');}
  function restoreSamples(){let count=0;for(const raw of window.USCPA_SEED){if(!db.topics.some(t=>t.id===raw.id || (t.subject===raw.subject&&t.title===raw.title))){db.topics.push(normalizeTopic(raw));count++;}}saveDb();render();toast(count?`サンプルを${count}件追加しました`:'サンプル論点はすべて登録済みです');}
  function resetAll(){if(!window.confirm('全論点・学習記録を初期化します。バックアップを保存済みですか？'))return;if(!window.confirm('最終確認：すべて削除し、初期サンプルだけに戻します。'))return;db=initialDb();saveDb();state.subject='ALL';state.status='ALL';state.search='';navigate('home');toast('初期状態に戻しました');}
  function render(){const views={home,library,detail,review,data:dataPage};const body=(views[state.view]||home)();root.innerHTML=`<div class="layout">${sidebar()}<main class="content">${mobileTop()}${storeFailure?`<div class="storage-alert">${icon('alert')} この端末にデータを保存できない可能性があります。JSONバックアップを必ず保存してください。</div>`:''}${topbar()}${body}</main></div>${bottomNav()}${modalForm()}`;}
  root.addEventListener('click', e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;const id=b.dataset.id;switch(a){
    case 'nav':navigate(b.dataset.view);break;
    case 'subject':state.subject=b.dataset.subject;state.status='ALL';state.search='';navigate('library');break;
    case 'filter-subject':state.subject=b.dataset.subject;render();break;
    case 'filter-status':state.status=b.dataset.status;render();break;
    case 'detail':showDetail(id);break;
    case 'detail-tab':state.detailTab=b.dataset.tab;state.detailQuizAnswer=null;render();break;
    case 'favorite':{const p=prog(id);p.favorite=!p.favorite;db.progress[id]=p;saveDb();render();toast(p.favorite?'お気に入りに登録しました':'お気に入りを解除しました');break;}
    case 'set-status':setManualStatus(id,b.dataset.status);break;
    case 'add':state.modal={kind:'add'};render();break;
    case 'edit':state.modal={kind:'edit',id};render();break;
    case 'close-modal':state.modal=null;render();break;
    case 'delete-topic':deleteTopic(id);break;
    case 'detail-answer':{if(state.detailQuizAnswer!==null)return;const t=db.topics.find(x=>x.id===state.detailId);const q=t?.questions[state.detailQuizIndex];if(!q)return;const answer=Number(b.dataset.index);state.detailQuizAnswer=answer;recordAnswer(t.id,answer===q.correctIndex);render();break;}
    case 'detail-next':{const t=db.topics.find(x=>x.id===state.detailId);state.detailQuizIndex=(state.detailQuizIndex+1)%(t?.questions.length||1);state.detailQuizAnswer=null;render();break;}
    case 'start-quiz':buildQuiz();break;
    case 'quiz-answer':{const q=state.quiz;if(!q||q.answer!==null)return;const current=q.queue[q.cursor];const t=db.topics.find(x=>x.id===current.id);const question=t.questions[current.idx];const answer=Number(b.dataset.index);q.answer=answer;const correct=answer===question.correctIndex;if(correct)q.correct++;else q.wrong++;recordAnswer(t.id,correct);render();break;}
    case 'quiz-next':state.quiz.cursor++;state.quiz.answer=null;render();break;
    case 'quit-quiz':state.quiz=null;render();break;
    case 'quiz-retry':state.quiz=null;render();break;
    case 'export-backup':downloadJson({schema:'uscpa-knowledge-lab-backup',version:1,exportedAt:new Date().toISOString(),topics:db.topics,progress:db.progress,settings:db.settings},`uscpa-lab-backup-${dateFilename()}.json`);break;
    case 'export-topics':downloadJson({schema:'uscpa-knowledge-lab-topics',version:1,topics:db.topics},`uscpa-lab-topics-${dateFilename()}.json`);break;
    case 'choose-file':document.getElementById('import-file')?.click();break;
    case 'import-paste':{const v=document.getElementById('json-paste')?.value;if(!v?.trim())toast('JSONを貼り付けてください。',true);else doImport(v);break;}
    case 'copy-prompt':copyText(PROMPT);break;
    case 'restore-samples':restoreSamples();break;
    case 'reset-all':resetAll();break;
  }});
  root.addEventListener('input',e=>{if(e.target?.id==='topic-search'){state.search=e.target.value;renderLibraryResults();}});
  root.addEventListener('change',async e=>{if(e.target?.id==='import-file'){const file=e.target.files?.[0];if(!file)return;if(file.size>12*1024*1024){toast('12MB以下のJSONファイルを選んでください。',true);return;}try{doImport(await file.text());}catch(err){toast('ファイルを読み込めませんでした。',true);}e.target.value='';}if(e.target?.id==='quiz-subject')state.quizSubject=e.target.value;if(e.target?.id==='quiz-mode')state.quizMode=e.target.value;});
  root.addEventListener('submit',e=>{if(e.target?.id==='topic-form'){e.preventDefault();saveForm(e.target);}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}});
  saveDb();render();
  // Single-file GitHub Pages edition; offline caching requires the multi-file package.
})();

  </script>
